<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101a2b">
    <title>INIADの紹介</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d2b3d;
        --muted: #627187;
        --accent: #286b83;
        --accent-dark: #17465d;
        --paper: #fff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 64px 24px;
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        line-height: 1.9;
        background:
          radial-gradient(ellipse at 86% 12%, rgba(116, 95, 173, .13), transparent 28rem),
          radial-gradient(ellipse at 12% 88%, rgba(64, 145, 164, .12), transparent 30rem),
          #eef3f6;
      }

      main {
        position: relative;
        width: min(100%, 880px);
        margin: 0 auto;
        padding: clamp(32px, 7vw, 72px);
        overflow: hidden;
        background: var(--paper);
        border: 1px solid rgba(37, 76, 98, .1);
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(24, 48, 69, .12);
      }

      main::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        content: "";
        background: linear-gradient(90deg, #286b83, #6f77a8 72%, #b29bca);
      }

      h1 {
        margin: 0 0 48px;
        color: #173c55;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: .08em;
        line-height: 1.35;
      }

      h1::after {
        display: block;
        width: 64px;
        height: 3px;
        margin-top: 20px;
        content: "";
        background: linear-gradient(90deg, var(--accent), #9b8cb6);
        border-radius: 99px;
      }

      h2 {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 40px 0 14px;
        color: var(--accent-dark);
        font-size: 1.35rem;
      }

      h2::before {
        width: 8px;
        height: 8px;
        content: "";
        background: #7181a5;
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(113, 129, 165, .35);
      }

      p { margin: 0; color: var(--muted); }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 12px;
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        padding: 14px 16px 14px 38px;
        color: #33475b;
        background: #f5f8fa;
        border: 1px solid #e7edf1;
        border-radius: 12px;
        transition: transform .2s ease, border-color .2s ease, background .2s ease;
      }

      li::before {
        position: absolute;
        top: 50%;
        left: 16px;
        color: #7181a5;
        content: "✦";
        font-size: .85rem;
        transform: translateY(-50%);
      }

      li:hover {
        background: #f1f5f8;
        border-color: #cbd9e1;
        transform: translateY(-2px);
      }

      @media (max-width: 600px) {
        body { padding: 24px 14px; }
        main { border-radius: 18px; }
        h1 { margin-bottom: 36px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>INIADの紹介</h1>
      <section aria-labelledby="overview-heading">
        <h2 id="overview-heading">概要</h2>
        <p>INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。さらに、ソースプログラム管理システム「Git」を用いた実践的な学びを通じて、情報技術の基礎から応用まで幅広く身につけます。</p>
      </section>
      <section aria-labelledby="subjects-heading">
        <h2 id="subjects-heading">科目群一覧</h2>
        <ul>
          <li>コンピュータ・システム</li>
          <li>コンピュータ・ソフトウェア</li>
          <li>ユーザ・エクスペリエンス</li>
          <li>データサイエンス</li>
          <li>ICT社会応用</li>
          <li>連携科目群</li>
          <li>ビジネス構築</li>
          <li>コミュニティ形成</li>
        </ul>
      </section>
    </main>
  </body>
</html>
